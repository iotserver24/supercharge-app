<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supercharge</title>
  <style>
    :root { --bg:#0e0f12; --card:#181a20; --text:#eceef2; --muted:#8b90a0; --line:#2a2d36; --accent:#6ea8ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; }
    #app { min-height: 100%; display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 650; }
    main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 720px; width: 100%; margin: 0 auto; }
    .log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 14px; max-width: 92%; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #2a3344; }
    .agent { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
    .sys { align-self: center; color: var(--muted); font-size: 13px; }
    form { display: flex; gap: 8px; }
    input, button { font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 12px 14px; }
    input { flex: 1; }
    button { background: var(--accent); color: #0b1220; border: 0; font-weight: 650; }
    .gate { margin: auto; width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px; }
    .hint { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <header>Supercharge</header>
    <main>
      <div id="gate" class="gate">
        <p>Password is <code>SUPERCHARGE_PASSWORD</code>. This page talks to the daemon; the daemon launches Supercharge CLI.</p>
        <form id="login">
          <input id="password" type="password" placeholder="Password" required />
          <button type="submit">Connect</button>
        </form>
        <p class="hint">Phone app: login with this host + password. CLI: <code>supercharge --remote ws://HOST:6767/ws --secret PASS</code> is not used — use the app or this page.</p>
      </div>
      <div id="chat" hidden>
        <div id="log" class="log"></div>
        <form id="send">
          <input id="prompt" autocomplete="off" placeholder="Message" />
          <button type="submit">Send</button>
        </form>
      </div>
    </main>
  </div>
  <script>
    let token = "";
    const logEl = document.getElementById("log");
    function add(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      return d;
    }
    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: {
          "content-type": "application/json",
          ...(token ? { authorization: "Bearer " + token } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }
    function listen() {
      const es = new EventSource("/api/instances/local/chat/events?token=" + encodeURIComponent(token));
      es.onmessage = (ev) => {
        const row = JSON.parse(ev.data);
        if (row.type === "user") add("user", row.text || "");
        else if (row.type === "text") add("agent", row.text || "");
        else if (row.type === "error") add("sys", row.text || "error");
        else if (row.type === "done") add("sys", "done");
        else if (row.type === "tool") add("sys", (row.title || "tool") + " " + (row.state || ""));
      };
    }
    document.getElementById("login").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const data = await api("POST", "/api/auth/login", { password: document.getElementById("password").value });
        token = data.token;
        document.getElementById("gate").hidden = true;
        document.getElementById("chat").hidden = false;
        listen();
      } catch (err) {
        alert(err.message);
      }
    };
    document.getElementById("send").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("prompt");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      await api("POST", "/api/instances/local/chat", { text });
    };
  </script>
</body>
</html>
